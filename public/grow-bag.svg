  <path d="M 80 48 C 66 44, 66 54, 72 60 C 80 62, 86 56, 80 48 Z" fill="#4ade80" stroke="#1b291d" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Branch Right Leaves -->
  <path d="M 130 36 C 146 28, 148 38, 142 46 C 134 50, 126 44, 130 36 Z" fill="#16a34a" stroke="#1b291d" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 120 46 C 134 42, 134 52, 128 58 C 120 60, 114 54, 120 46 Z" fill="#4ade80" stroke="#1b291d" stroke-width="3" stroke-linejoin="round"/>

  <!-- Left Heavy-Duty Webbing Handle -->
  <path d="M 50 94 C 28 94, 28 126, 50 126" stroke="#1b291d" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M 50 94 C 30 94, 30 126, 50 126" stroke="#486950" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Right Heavy-Duty Webbing Handle -->
  <path d="M 150 94 C 172 94, 172 126, 150 126" stroke="#1b291d" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M 150 94 C 170 94, 170 126, 150 126" stroke="#486950" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Soil Top Mound -->
  <ellipse cx="100" cy="78" rx="52" ry="14" fill="#6a401d" stroke="#1b291d" stroke-width="5"/>
  <path d="M 68 76 C 80 72, 120 72, 132 76" stroke="#4e2c11" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Fabric Grow Bag Main Body -->
  <path d="M 48 78 L 54 162 C 54 176, 146 176, 146 162 L 152 78 C 152 78, 100 88, 48 78 Z" fill="#385640" stroke="#1b291d" stroke-width="5" stroke-linejoin="round"/>

