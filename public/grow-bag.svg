<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Thriving Foliage / Plant Sprouting from Bag -->
  <!-- Main Plant Stems -->
  <path d="M 100 80 L 100 40" stroke="#1b291d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 100 62 Q 78 52 70 38" stroke="#1b291d" stroke-width="4" stroke-linecap="round"/>
  <path d="M 100 56 Q 122 48 130 36" stroke="#1b291d" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Plant Leaves (Green with dark outline) -->
  <!-- Center Top Leaf -->
  <path d="M 100 40 C 90 28, 92 18, 100 12 C 108 18, 110 28, 100 40 Z" fill="#22c55e" stroke="#1b291d" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Top Left Leaf -->
  <path d="M 100 48 C 84 38, 76 44, 80 52 C 86 58, 94 54, 100 48 Z" fill="#16a34a" stroke="#1b291d" stroke-width="3.5" stroke-linejoin="round"/>
