  <!-- Collar Stitching Line -->
  <path d="M 53 86 Q 100 96 147 86" stroke="#78a081" stroke-width="1.8" stroke-dasharray="3,3" fill="none"/>

  <!-- Vertical Webbing Support Straps -->
  <rect x="74" y="93" width="9" height="74" fill="#2d4634" stroke="#1b291d" stroke-width="3" rx="2"/>
  <path d="M 78.5 96 L 78.5 164" stroke="#78a081" stroke-width="1.5" stroke-dasharray="3,3"/>

  <rect x="117" y="93" width="9" height="74" fill="#2d4634" stroke="#1b291d" stroke-width="3" rx="2"/>
  <path d="M 121.5 96 L 121.5 164" stroke="#78a081" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Front Fabric Badge: "AIR PRUNING 350 GSM" Leaf Tag -->
  <rect x="91" y="112" width="18" height="22" rx="4" fill="#fffdf2" stroke="#1b291d" stroke-width="2.5"/>
  <path d="M 100 117 C 95 120, 95 127, 100 130 C 105 127, 105 120, 100 117 Z" fill="#22c55e" stroke="#1b291d" stroke-width="1.5"/>
  <path d="M 100 122 L 100 130" stroke="#1b291d" stroke-width="1.5"/>

  <!-- Aeration Breathing Micro-Pores -->
  <circle cx="64" cy="115" r="1.5" fill="#4e7257"/>
  <circle cx="64" cy="135" r="1.5" fill="#4e7257"/>
  <circle cx="64" cy="155" r="1.5" fill="#4e7257"/>
  <circle cx="136" cy="115" r="1.5" fill="#4e7257"/>
  <circle cx="136" cy="135" r="1.5" fill="#4e7257"/>
  <circle cx="136" cy="155" r="1.5" fill="#4e7257"/>

  <!-- Base Shadow / Rim -->
  <path d="M 60 165 Q 100 176 140 165" stroke="#1b291d" stroke-width="3.5" stroke-linecap="round" fill="none"/>
